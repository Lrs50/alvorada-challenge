[project]
name = "olist-pipeline"
version = "0.1.0"
description = "Sales pipeline and payment reconciliation for Olist e-commerce data, loaded into PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
