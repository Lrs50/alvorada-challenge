[project]
name = "olist-pipeline"
version = "0.1.0"
description = "Sales pipeline and payment reconciliation for Olist e-commerce data, loaded into PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
